# Local Postgres for development. The application connects as visage_app, which
# scripts/setup-db.mjs creates; this container only provides the server and a
# superuser to bootstrap with.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    ports: ['5432:5432']
    volumes: ['visage-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  visage-pgdata:
